{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-stack" role="status">
    {% for category, message in messages %}
    <div class="flash flash-{{ category if category in ('success','danger','warning','info') else 'info' }}">
      <span>{{ message }}</span>
      <button type="button" class="flash-close" aria-label="Dismiss" data-dismiss-flash>&times;</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
